<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Building Allocation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='building_allocation.css') }}">
</head>
<body>
    <h1>Building Allocation Details</h1>

    <form id="building-form">
        <input type="hidden" id="building-id">
        <label>Building Name:</label>
        <input type="text" id="building-name" required>
        <label>Department:</label>
        <input type="text" id="department" required>
        <label>No. of Exam Halls:</label>
        <input type="number" id="num-exam-halls" required>
        <button type="submit" id="submitBtn">Add/Update</button>
    </form>

    <table id="allocation-table">
        <thead>
            <tr>
                <th>Building Name</th>
                <th>Department</th>
                <th>Exam Halls</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="buildingTableBody"></tbody>
    </table>

    <script src="{{ url_for('static', filename='building_allocation.js') }}"></script>
</body>
</html>
